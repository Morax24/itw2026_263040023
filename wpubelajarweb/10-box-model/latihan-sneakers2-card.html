<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sneakers Card V2</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #740d0d;
        font-family: Arial, Helvetica, sans-serif;
        padding: 40px;
      }

      .product-card {
        background-color: #2e0550;
        width: 330px;
        margin: 0 auto;
        border-radius: 16px;
        padding: 24px;
        border: 1px solid #eae8e8;
        box-shadow: 0 10px 20px rgb(0 0 0 / 0.4);
      }

      .product-image {
        position: relative;
        width: 100%;
        height: 220px;
        overflow: hidden;
        border-radius: 12px;
        margin-bottom: 20px;
      }

      .product-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .product-badge {
        position: absolute;
        top: 12px;
        left: 12px;
        background-color: #f0eae8;
        color: #0b0b0b;
        font-size: 11px;
        font-weight: bold;
        letter-spacing: 1px;
        padding: 6px 10px;
        border-radius: 20px;
      }

      .product-category {
        font-size: 12px;
        color: #eae3e0;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        font-weight: bold;
        margin-bottom: 8px;
      }

      .product-title {
        font-size: 22px;
        font-weight: bold;
        color: #f6f0f0;
        margin-bottom: 12px;
      }

      .product-description {
        font-size: 14px;
        color: #a8a8a8;
        line-height: 1.6;
        margin-bottom: 20px;
        padding-bottom: 20px;
        border-bottom: 1px solid #030202;
      }

      .price-section {
        margin-bottom: 20px;
      }

      .price-section .price {
        font-size: 26px;
        color: #fff;
        font-weight: bold;
      }

      .price-section .original-price {
        font-size: 15px;
        color: #eeeaea;
        text-decoration: line-through;
        margin-left: 8px;
      }

      .option-wrapper {
        border: none;
      }

      .option-label-text {
        font-size: 13px;
        color: #f3ecec;
        font-weight: bold;
        margin-bottom: 12px;
      }

      .color-options {
        margin-bottom: 20px;
      }

      .color-options input[type='radio'] {
        display: none;
      }

      .color-options label {
        display: inline-block;
        width: 32px;
        height: 32px;
        border: 2px solid transparent;
        outline: 2px solid #3a3a3a;
        outline-offset: 2px;
        margin-right: 10px;
        border-radius: 50%;
        cursor: pointer;
        transition: 0.3s ease;
      }

      .color-options .c-Red {
        background-color: #f60606;
      }

      .color-options .c-Pink {
        background-color: #ef08ba;
      }

      .color-options .c-Black {
        background-color: #000;
      }

      .color-options input[type='radio']:checked + label {
        outline-color: #ff5a1f;
      }

      .size-options {
        margin-bottom: 25px;
      }

      .size-options input[type='radio'] {
        display: none;
      }

      .size-options label {
        display: inline-block;
        width: 44px;
        height: 44px;
        border: 2px solid #3a3a3a;
        text-align: center;
        line-height: 40px;
        margin-right: 8px;
        font-weight: bold;
        color: #bbb;
        cursor: pointer;
        border-radius: 8px;
        transition: 0.3s ease;
      }

      .size-options label:hover {
        border-color: #ff5a1f;
      }

      .size-options input[type='radio']:checked + label {
        background-color: #ff5a1f;
        border-color: #ff5a1f;
        color: #fff;
      }

      .buy-button {
        width: 100%;
        padding: 16px;
        background-color: #ff5a1f;
        color: white;
        border: none;
        border-radius: 10px;
        text-transform: uppercase;
        font-weight: bold;
        letter-spacing: 1px;
        cursor: pointer;
        transition: 0.3s ease;
      }

      .buy-button:hover {
        background-color: #e04a12;
      }
    </style>
  </head>

  <body>
    <article class="product-card">
      <figure class="product-image">
        <img src="Speedcat-Ballet-Suede-Women's-Shoes.png" alt="Women's Shoes" />
        <span class="product-badge">DISKON 35%</span>
      </figure>

      <p class="product-category">sneaker hybrid</p>
      <h3 class="product-title">Puma Speedcat ballet</h3>

      <p class="product-description">Sepatu hybrid yang menggabungkan gaya klasik dengan kenyamanan modern, cocok untuk aktivitas sehari-hari.</p>

      <div class="price-section">
        <span class="price">IDR 40,649,000</span>
        <del class="original-price">IDR 99,199,000</del>
      </div>

      <form action="">
        <fieldset class="option-wrapper">
          <legend class="option-label-text">Pilih Warna:</legend>
          <div class="color-options">
            <input type="radio" name="color" id="c1" value="Red" checked />
            <label for="c1" class="c-Red" title="Red"></label>

            <input type="radio" name="color" id="c2" value="Pink" />
            <label for="c2" class="c-Pink" title="Pink"></label>

            <input type="radio" name="color" id="c3" value="Black" />
            <label for="c3" class="c-Black" title="Black"></label>
          </div>
        </fieldset>

        <fieldset class="option-wrapper">
          <legend class="option-label-text">Pilih Ukuran (US):</legend>
          <div class="size-options">
            <input type="radio" name="size" id="s8" value="8" />
            <label for="s8">8</label>

            <input type="radio" name="size" id="s9" value="9" />
            <label for="s9">9</label>

            <input type="radio" name="size" id="s10" value="10" />
            <label for="s10">10</label>

            <input type="radio" name="size" id="s11" value="11" />
            <label for="s11">11</label>

            <input type="radio" name="size" id="s12" value="12" />
            <label for="s12">12</label>
          </div>
        </fieldset>

        <button class="buy-button" type="submit">Tambahkan ke Keranjang</button>
      </form>
    </article>
  </body>
</html>
